name: GPT Delta Wake

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Build fail-closed wake packet
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          packet = {
              "schema": "sos.gpt-wake.v1",
              "repo": os.environ["REPOSITORY"],
              "event": os.environ["EVENT_NAME"],
              "ref": os.environ.get("REF_NAME", ""),
              "sha": os.environ["SHA"],
              "delivery_id": f'{os.environ["RUN_ID"]}:{os.environ["RUN_ATTEMPT"]}',
              "to": "GPT",
              "action": "observe_and_review",
              "live_rail": False,
          }
          print(json.dumps(packet, sort_keys=True))
          PY

      # Transport intentionally disabled in v1.
      # Add an authorized wake adapter only after its endpoint/auth model is
      # reviewed. Do not put credentials into the emitted packet.
