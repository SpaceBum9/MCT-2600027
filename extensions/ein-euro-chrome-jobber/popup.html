<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Ein-Euro Jobber</title>
  <style>
    :root { color-scheme: light; }
    body { font: 13px/1.4 system-ui, sans-serif; margin: 0; width: 320px; color: #111; background: #fff; }
    header { padding: 12px 14px 8px; border-bottom: 1px solid #e5e7eb; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    p.note { margin: 0; color: #4b5563; font-size: 12px; }
    main { padding: 12px 14px 16px; display: grid; gap: 10px; }
    label { display: grid; gap: 4px; font-size: 12px; color: #374151; }
    input { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; }
    button { padding: 8px 10px; border: 0; border-radius: 6px; background: #111; color: #fff; cursor: pointer; }
    button.secondary { background: #e5e7eb; color: #111; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    li { font-size: 11px; color: #374151; word-break: break-all; }
    .err { color: #b91c1c; min-height: 1.2em; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Ein-Euro Chrome-Jobber</h1>
    <p class="note">Nur eigene Partnerverträge. Kein stilles Umschreiben fremder Tabs. Paywalls werden bezahlt.</p>
  </header>
  <main>
    <label>Händler-Host
      <input id="host" placeholder="shop.example.de" autocomplete="off" />
    </label>
    <label>Dein HTTPS-Template
      <input id="template" placeholder="https://shop.example.de/?ref=DEINCODE" autocomplete="off" />
    </label>
    <div class="row">
      <button id="save" class="secondary" type="button">Route speichern</button>
      <button id="job" type="button">Aktiven Tab routen</button>
    </div>
    <p class="err" id="status"></p>
    <p class="note">Routen</p>
    <ul id="routes"></ul>
    <p class="note">Letzte Jobs</p>
    <ul id="jobs"></ul>
  </main>
  <script src="popup.js"></script>
</body>
</html>
